<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fff9f3">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>我的色彩環</title>
<style>
  :root{
    --ink:#2f3040;
    --muted:#7a7d8b;
    --paper:#fff9f3;
    --card:#ffffff;
    --line:#eee5dc;
    --shadow:0 14px 34px rgba(69,52,36,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fffaf4,#f6fbff);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
  body{min-height:100dvh;display:flex;justify-content:center}
  button{font:inherit}
  .app{width:min(100%,760px);padding:18px 16px 30px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  h1{font-size:clamp(28px,6vw,42px);margin:0;font-weight:900;letter-spacing:.03em}
  .sub{margin:4px 0 0;color:var(--muted);font-weight:700}
  .reset{
    border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;
    font-weight:900;color:#555;box-shadow:var(--shadow);white-space:nowrap
  }
  .status{
    background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:22px;
    padding:11px 14px;margin:12px 0 14px;box-shadow:var(--shadow);text-align:center;
    font-size:17px;font-weight:900
  }
  .status small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .wheel-card{
    position:relative;background:rgba(255,255,255,.94);border:2px solid var(--line);
    border-radius:32px;box-shadow:var(--shadow);padding:14px;overflow:hidden
  }
  .wheel{
    width:min(92vw,620px);aspect-ratio:1;margin:auto;position:relative;border-radius:50%;
  }
  .guide{
    position:absolute;inset:14%;border:3px dashed #eee9e3;border-radius:50%;
  }
  .center{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:38%;aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid #efe7df;
    box-shadow:0 10px 28px rgba(0,0,0,.08);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:12px;z-index:4;
    transition:.25s
  }
  .center .formula{font-size:clamp(18px,4vw,27px);font-weight:900;line-height:1.25}
  .center .result{font-size:clamp(15px,3.7vw,22px);font-weight:900;margin-top:6px}
  .center .mini{font-size:12px;color:#888;font-weight:800;margin-top:5px}
  .node{
    position:absolute;left:50%;top:50%;width:clamp(62px,16vw,94px);aspect-ratio:1;
    border-radius:50%;border:5px solid #fff;box-shadow:0 9px 18px rgba(0,0,0,.12);
    transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(.4);
    opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:opacity .35s, transform .35s, box-shadow .18s, outline .18s;
    color:white;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.28);text-align:center;
    padding:6px;z-index:5;
  }
  .node.visible{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(1)}
  .node.selected{outline:6px solid #333;outline-offset:3px;box-shadow:0 0 0 8px rgba(255,255,255,.9),0 12px 26px rgba(0,0,0,.18)}
  .node .zh{display:block;font-size:clamp(13px,3vw,18px);line-height:1.05}
  .node .en{display:block;font-size:clamp(9px,2.3vw,12px);opacity:.9;margin-top:2px}
  .node.light{color:#4b443a;text-shadow:none}
  .node.pop{animation:birth .75s cubic-bezier(.2,.8,.2,1)}
  @keyframes birth{
    0%{filter:brightness(1.4);transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(.15) rotate(-18deg)}
    65%{transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(1.18) rotate(7deg)}
    100%{transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(1) rotate(0)}
  }
  .spark{
    position:fixed;font-size:24px;pointer-events:none;z-index:999;animation:spark .8s ease-out forwards
  }
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(240deg);opacity:0}}
  .helper{
    margin-top:14px;background:#fff;border:2px solid var(--line);border-radius:24px;
    box-shadow:var(--shadow);padding:14px
  }
  .helper-title{font-weight:900;font-size:18px;margin-bottom:8px}
  .tips{display:flex;gap:8px;flex-wrap:wrap}
  .tip{
    border:2px solid #eee6de;background:#fff;border-radius:999px;padding:8px 11px;
    font-size:13px;font-weight:900;color:#666
  }
  .reverse-panel{display:none;background:#fff;border:2px solid var(--line);border-radius:32px;box-shadow:var(--shadow);padding:20px 16px;text-align:center}
  .reverse-panel.show{display:block}
  .question-label{font-size:15px;font-weight:900;color:var(--muted);letter-spacing:.08em}
  .target-swatch{width:min(54vw,260px);aspect-ratio:1.45;margin:12px auto;border:7px solid #fff;border-radius:28px;box-shadow:0 12px 28px rgba(0,0,0,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}
  .target-name{font-size:clamp(28px,7vw,42px);font-weight:900}
  .target-hex{font-size:17px;font-weight:900;margin-top:5px}
  .reverse-question{font-size:clamp(19px,4.8vw,27px);font-weight:900;margin:14px 0 8px}
  .reverse-progress{color:var(--muted);font-weight:800}
  .reverse-picked{min-height:34px;margin:14px 0 10px;font-size:20px;font-weight:900}
  .answer-options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;margin:auto}
  .answer-btn{min-height:82px;border:5px solid #fff;border-radius:22px;box-shadow:0 7px 16px rgba(0,0,0,.15);font-weight:900;font-size:18px;cursor:pointer;transition:transform .16s,outline .16s;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
  .answer-btn.light{color:#4b443a;text-shadow:none}
  .answer-btn.selected{outline:5px solid #2f3040;outline-offset:2px;transform:scale(.95)}
  .answer-btn:disabled{cursor:default}
  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:#2f3040;color:#fff;padding:12px 18px;border-radius:999px;font-weight:900;
    opacity:0;pointer-events:none;transition:.2s;z-index:9999;white-space:nowrap;max-width:90vw;text-align:center
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .complete{
    position:fixed;inset:0;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;z-index:999;padding:24px
  }
  .complete.show{display:flex}
  .complete-box{
    width:min(92vw,460px);background:#fff;border-radius:32px;padding:28px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.16);border:2px solid var(--line)
  }
  .complete h2{font-size:32px;margin:0 0 8px}.complete p{color:#666;font-weight:800}
  .again{border:0;background:#2f3040;color:#fff;border-radius:999px;padding:14px 22px;font-weight:900;font-size:18px}
  @media(max-width:480px){
    .app{padding-left:10px;padding-right:10px}
    .wheel-card{padding:8px;border-radius:26px}
    .wheel{width:94vw}
    .center{width:35%}
    .node{border-width:4px}
    .reverse-panel{padding:16px 10px;border-radius:26px}
    .answer-options{gap:8px}
    .answer-btn{min-height:72px;font-size:16px;border-width:4px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>🎨 我的色彩環</h1>
      <p class="sub">從紅色、黃色、藍色開始，把色彩一個個變出來。</p>
    </div>
    <button class="reset" id="resetBtn">重新開始</button>
  </header>

  <div class="status" id="status">
    先選兩個顏色
    <small>試試看：紅色＋黃色、黃色＋藍色、藍色＋紅色</small>
  </div>

  <section class="wheel-card">
    <div class="wheel" id="wheel">
      <div class="guide"></div>
      <div class="center" id="center">
        <div class="formula" id="formula">點兩個顏色</div>
        <div class="result" id="resultText">看看會變出什麼？</div>
        <div class="mini" id="miniText">一次選兩個</div>
      </div>
    </div>
  </section>

  <section class="reverse-panel" id="reversePanel" aria-live="polite">
    <div class="question-label">進階考題</div>
    <div class="target-swatch" id="targetSwatch">
      <div class="target-name" id="targetName"></div>
      <div class="target-hex" id="targetHex"></div>
    </div>
    <div class="reverse-question" id="reverseQuestion"></div>
    <div class="reverse-progress" id="reverseProgress"></div>
    <div class="reverse-picked" id="reversePicked">已選：？ ＋ ？</div>
    <div class="answer-options" id="answerOptions"></div>
  </section>

  <section class="helper">
    <div class="helper-title">怎麼玩？</div>
    <div class="tips" id="tips"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="complete" id="complete">
  <div class="complete-box">
    <div style="font-size:58px">🌈</div>
    <h2>🎉 過關！</h2>
    <p>你完成了色彩大挑戰！</p>
    <button class="again" onclick="resetGame()">再玩一次</button>
  </div>
</div>

<script>
const colors = [
  {id:'red',zh:'紅色',en:'Red',hex:'#FF0000',light:false},
  {id:'redOrange',zh:'橘紅色',en:'Red Orange',hex:'#FF4500',light:false},
  {id:'orange',zh:'橙色',en:'Orange',hex:'#FFA500',light:true},
  {id:'yellowOrange',zh:'黃橙色',en:'Yellow Orange',hex:'#FFC000',light:true},
  {id:'yellow',zh:'黃色',en:'Yellow',hex:'#FFFF00',light:true},
  {id:'yellowGreen',zh:'黃綠色',en:'Yellow Green',hex:'#9ACD32',light:true},
  {id:'green',zh:'綠色',en:'Green',hex:'#008000',light:false},
  {id:'blueGreen',zh:'藍綠色',en:'Blue Green',hex:'#008080',light:false},
  {id:'blue',zh:'藍色',en:'Blue',hex:'#0000FF',light:false},
  {id:'bluePurple',zh:'藍紫色',en:'Blue Violet',hex:'#4B0082',light:false},
  {id:'purple',zh:'紫色',en:'Violet',hex:'#800080',light:false},
  {id:'redPurple',zh:'莓紅色',en:'Red Violet',hex:'#D81B60',light:false}
];

const primary = ['red','yellow','blue'];
const secondary = ['orange','green','purple'];
const tertiary = ['redOrange','yellowOrange','yellowGreen','blueGreen','bluePurple','redPurple'];

const recipes = {
  'red|yellow':'orange',
  'blue|yellow':'green',
  'blue|red':'purple',
  'orange|red':'redOrange',
  'orange|yellow':'yellowOrange',
  'green|yellow':'yellowGreen',
  'blue|green':'blueGreen',
  'blue|purple':'bluePurple',
  'purple|red':'redPurple'
};

const PHASES = Object.freeze({
  BUILD_3_TO_6:'BUILD_3_TO_6', BUILD_6_TO_12:'BUILD_6_TO_12',
  REVERSE_12_TO_6:'REVERSE_12_TO_6', REVERSE_6_TO_3:'REVERSE_6_TO_3',
  COMPLETE:'COMPLETE'
});
const secondaryRecipes = [
  ['red','yellow','orange'],['yellow','blue','green'],['blue','red','purple']
];
const tertiaryRecipes = [
  ['red','orange','redOrange'],['orange','yellow','yellowOrange'],
  ['yellow','green','yellowGreen'],['green','blue','blueGreen'],
  ['blue','purple','bluePurple'],['purple','red','redPurple']
];

let visible = new Set(primary);
let selected = [];
let locked = false;
let gamePhase = PHASES.BUILD_3_TO_6;
let reverseQuestions = [];
let reverseIndex = 0;

const wheel = document.getElementById('wheel');
const statusEl = document.getElementById('status');
const formulaEl = document.getElementById('formula');
const resultEl = document.getElementById('resultText');
const miniEl = document.getElementById('miniText');
const centerEl = document.getElementById('center');
const tipsEl = document.getElementById('tips');
const toastEl = document.getElementById('toast');
const wheelCardEl = document.querySelector('.wheel-card');
const helperEl = document.querySelector('.helper');
const reversePanelEl = document.getElementById('reversePanel');
const targetSwatchEl = document.getElementById('targetSwatch');
const targetNameEl = document.getElementById('targetName');
const targetHexEl = document.getElementById('targetHex');
const reverseQuestionEl = document.getElementById('reverseQuestion');
const reverseProgressEl = document.getElementById('reverseProgress');
const reversePickedEl = document.getElementById('reversePicked');
const answerOptionsEl = document.getElementById('answerOptions');

function getColor(id){ return colors.find(c=>c.id===id); }

function makeWheel(){
  colors.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='node'+(c.light?' light':'');
    btn.dataset.id=c.id;
    btn.style.background=c.hex;
    const angle=(-90 + i*30) * Math.PI/180;
    btn.dataset.cos=Math.cos(angle);
    btn.dataset.sin=Math.sin(angle);
    btn.innerHTML=`<span><span class="zh">${c.zh}</span><span class="en">${c.en}</span></span>`;
    btn.onclick=()=>selectColor(c.id);
    wheel.appendChild(btn);
  });
  positionNodes();
  render();
}

function positionNodes(){
  const size=wheel.clientWidth;
  const radius=size*0.39;
  document.querySelectorAll('.node').forEach(btn=>{
    btn.style.setProperty('--x', `${Number(btn.dataset.cos)*radius}px`);
    btn.style.setProperty('--y', `${Number(btn.dataset.sin)*radius}px`);
  });
}
new ResizeObserver(positionNodes).observe(wheel);

function pairKey(a,b){ return [a,b].sort().join('|'); }

function allowedRecipes(){
  if(gamePhase===PHASES.BUILD_3_TO_6)
    return secondaryRecipes.filter(r=>!visible.has(r[2]));
  if(gamePhase===PHASES.BUILD_6_TO_12)
    return tertiaryRecipes.filter(r=>!visible.has(r[2]));
  return [];
}

function isReverse(){
  return gamePhase===PHASES.REVERSE_12_TO_6 || gamePhase===PHASES.REVERSE_6_TO_3;
}

function shuffle(items){
  const copy=items.map(x=>[...x]);
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function beginReverse(phase, recipesForPhase){
  gamePhase=phase;
  reverseQuestions=shuffle(recipesForPhase);
  reverseIndex=0;
  selected=[];
  locked=false;
  updateCenter();
  render();
}

function currentQuestion(){ return reverseQuestions[reverseIndex] || null; }

function render(){
  const reverseMode=isReverse();
  wheelCardEl.style.display=reverseMode ? 'none' : '';
  helperEl.style.display=reverseMode ? 'none' : '';
  reversePanelEl.classList.toggle('show',reverseMode);
  document.querySelectorAll('.node').forEach(btn=>{
    btn.classList.toggle('visible', visible.has(btn.dataset.id));
    btn.classList.toggle('selected', selected.includes(btn.dataset.id));
  });

  const remaining=allowedRecipes();

  if(gamePhase===PHASES.BUILD_3_TO_6)
    statusEl.innerHTML=`第一階段：變出橙色、綠色、紫色<small>用紅色、黃色、藍色兩兩混合</small>`;
  else if(gamePhase===PHASES.BUILD_6_TO_12)
    statusEl.innerHTML=`第二階段：把 6 色變成 12 色<small>選色環上相鄰的兩個顏色</small>`;
  else if(gamePhase===PHASES.REVERSE_12_TO_6)
    statusEl.innerHTML=`進階挑戰：把顏色拆回去！<small>找出中央目標色的兩個來源色</small>`;
  else if(gamePhase===PHASES.REVERSE_6_TO_3)
    statusEl.innerHTML=`繼續拆解：把 6 色變回 3 色<small>找出中央目標色的兩個來源色</small>`;
  if(reverseMode) renderReverseQuestion();

  tipsEl.innerHTML='';
  const showAnswers=gamePhase===PHASES.BUILD_3_TO_6 || gamePhase===PHASES.BUILD_6_TO_12;
  if(showAnswers) remaining.forEach(([a,b])=>{
    const A=getColor(a), B=getColor(b);
    const tip=document.createElement('div');
    tip.className='tip';
    tip.textContent=`${A.zh} ＋ ${B.zh}`;
    tipsEl.appendChild(tip);
  });
  if(isReverse()) tipsEl.innerHTML='<div class="tip">選出兩個來源色</div>';
}

function reverseChoices(){
  return gamePhase===PHASES.REVERSE_12_TO_6
    ? ['red','orange','yellow','green','blue','purple']
    : ['red','yellow','blue'];
}

function renderReverseQuestion(){
  const q=currentQuestion();
  if(!q) return;
  const target=getColor(q[2]);
  targetSwatchEl.style.background=target.hex;
  targetSwatchEl.style.color=target.light ? '#4b443a' : '#fff';
  targetNameEl.textContent=target.zh;
  targetHexEl.textContent=target.hex;
  reverseQuestionEl.textContent=`${target.zh}是由哪兩個顏色混合而成？`;
  reverseProgressEl.textContent=`第 ${reverseIndex+1} 題／共 ${reverseQuestions.length} 題`;
  reversePickedEl.textContent=selected.length===0 ? '已選：？ ＋ ？' :
    selected.length===1 ? `已選：${getColor(selected[0]).zh} ＋ ？` :
    `已選：${getColor(selected[0]).zh} ＋ ${getColor(selected[1]).zh}`;
  answerOptionsEl.innerHTML='';
  reverseChoices().forEach(id=>{
    const c=getColor(id), btn=document.createElement('button');
    btn.className='answer-btn'+(c.light?' light':'')+(selected.includes(id)?' selected':'');
    btn.style.background=c.hex;
    btn.textContent=c.zh;
    btn.disabled=locked;
    btn.onclick=()=>selectReverseColor(id);
    answerOptionsEl.appendChild(btn);
  });
}

function selectReverseColor(id){
  if(locked || !reverseChoices().includes(id)) return;
  if(selected.includes(id)){
    selected=selected.filter(x=>x!==id);
    renderReverseQuestion();
    return;
  }
  if(selected.length>=2) selected=[];
  selected.push(id);
  renderReverseQuestion();
  if(selected.length===2) setTimeout(checkMix,180);
}

function selectColor(id){
  if(locked || !visible.has(id)) return;

  if(selected.includes(id)){
    selected=selected.filter(x=>x!==id);
    updateCenter();
    render();
    return;
  }

  if(selected.length===2) selected=[];
  selected.push(id);
  updateCenter();
  render();

  if(selected.length===2){
    setTimeout(checkMix,180);
  }
}

function updateCenter(){
  if(isReverse()){
    const q=currentQuestion();
    if(!q) return;
    const target=getColor(q[2]);
    centerEl.style.background=target.hex;
    centerEl.style.color=target.light ? '#4b443a' : '#fff';
    formulaEl.textContent=target.zh;
    resultEl.textContent=selected.length===0 ? `${target.zh}是由哪兩個顏色變出來的？` :
      selected.length===1 ? `${getColor(selected[0]).zh} ＋ ？` :
      `${getColor(selected[0]).zh} ＋ ${getColor(selected[1]).zh}`;
    miniEl.textContent=`第 ${reverseIndex+1} 題／共 ${reverseQuestions.length} 題`;
    return;
  }
  centerEl.style.background='#fff';
  centerEl.style.color='';
  if(selected.length===0){
    formulaEl.textContent='點兩個顏色';
    resultEl.textContent='看看會變出什麼？';
    miniEl.textContent='一次選兩個';
  }else if(selected.length===1){
    const a=getColor(selected[0]);
    formulaEl.textContent=`${a.zh} ＋ ？`;
    resultEl.textContent='再選一個顏色';
    miniEl.textContent='';
  }else{
    const a=getColor(selected[0]), b=getColor(selected[1]);
    formulaEl.textContent=`${a.zh} ＋ ${b.zh}`;
    resultEl.textContent='混合中…';
    miniEl.textContent='';
  }
}

function checkMix(){
  const [a,b]=selected;
  if(isReverse()){
    checkReverse(a,b);
    return;
  }
  const resultId=recipes[pairKey(a,b)];
  const valid = resultId && !visible.has(resultId) && isCurrentStageRecipe(a,b,resultId);

  if(valid){
    createColor(a,b,resultId);
  }else{
    const A=getColor(a), B=getColor(b);
    playError();
    showToast(`${A.zh}＋${B.zh} 現在不會產生新顏色，再試一組`);
    resultEl.textContent='再試一次';
    miniEl.textContent='找找看可以變出新顏色的組合';
    setTimeout(()=>{
      selected=[];
      updateCenter();
      render();
    },700);
  }
}

function checkReverse(a,b){
  const q=currentQuestion();
  if(q && pairKey(a,b)===pairKey(q[0],q[1])){
    locked=true;
    const A=getColor(a), B=getColor(b), R=getColor(q[2]);
    reversePickedEl.textContent=`答對了！${R.zh}＝${A.zh} ＋ ${B.zh}`;
    playSuccess();
    burst(targetSwatchEl);
    speak(`答對了！${R.zh}，是${A.zh}加${B.zh}。`);
    setTimeout(()=>{
      visible.delete(q[2]);
      selected=[];
      reverseIndex++;
      locked=false;
      if(reverseIndex>=reverseQuestions.length){
        if(gamePhase===PHASES.REVERSE_12_TO_6){
          beginReverse(PHASES.REVERSE_6_TO_3,secondaryRecipes);
        }else{
          gamePhase=PHASES.COMPLETE;
          playWin();
          document.getElementById('complete').classList.add('show');
        }
      }else{
        updateCenter();
        render();
      }
    },900);
  }else{
    playError();
    showToast('再想想看！');
    reversePickedEl.textContent='再想想看！';
    setTimeout(()=>{ selected=[]; renderReverseQuestion(); },700);
  }
}

function isCurrentStageRecipe(a,b,r){
  return allowedRecipes().some(x=>pairKey(x[0],x[1])===pairKey(a,b) && x[2]===r);
}

function createColor(a,b,resultId){
  locked=true;
  const A=getColor(a), B=getColor(b), R=getColor(resultId);

  formulaEl.textContent=`${A.zh} ＋ ${B.zh}`;
  resultEl.textContent=`＝ ${R.zh}！`;
  miniEl.textContent=`${R.en}`;

  playSuccess();
  speak(`${A.zh}加${B.zh}，變成${R.zh}。`);

  setTimeout(()=>{
    visible.add(resultId);
    render();
    const btn=document.querySelector(`.node[data-id="${resultId}"]`);
    btn.classList.add('pop');
    burst(btn);
    setTimeout(()=>btn.classList.remove('pop'),800);
  },280);

  setTimeout(()=>{
    selected=[];
    locked=false;
    updateCenter();
    render();

    advanceAfterBuild();
  },1000);
}

function advanceAfterBuild(){
  if(gamePhase===PHASES.BUILD_3_TO_6 && secondary.every(x=>visible.has(x))){
    gamePhase=PHASES.BUILD_6_TO_12;
  }else if(gamePhase===PHASES.BUILD_6_TO_12 && tertiary.every(x=>visible.has(x))){
    showToast('進階挑戰：把顏色拆回去！');
    beginReverse(PHASES.REVERSE_12_TO_6,tertiaryRecipes);
    return;
  }
  updateCenter();
  render();
}

function burst(target){
  const r=target.getBoundingClientRect();
  const x=r.left+r.width/2, y=r.top+r.height/2;
  const icons=['✨','⭐','💫','🎨','✨','⭐'];
  icons.forEach((ic,i)=>{
    const s=document.createElement('div');
    s.className='spark';
    s.textContent=ic;
    s.style.left=(x-12)+'px';
    s.style.top=(y-12)+'px';
    const ang=i*(Math.PI*2/icons.length);
    s.style.setProperty('--dx',`${Math.cos(ang)*70}px`);
    s.style.setProperty('--dy',`${Math.sin(ang)*70}px`);
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),850);
  });
}

function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t=setTimeout(()=>toastEl.classList.remove('show'),1300);
}

let audioCtx=null;
function ensureAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,dur=.12,type='sine',delay=0){
  ensureAudio();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
  const t=audioCtx.currentTime+delay;
  g.gain.setValueAtTime(.18,t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t);o.stop(t+dur);
}
function playSuccess(){tone(523,.1);tone(659,.13,'sine',.11)}
function playError(){tone(190,.16,'triangle')}
function playWin(){tone(523,.1);tone(659,.1,'sine',.1);tone(784,.1,'sine',.2);tone(1047,.3,'sine',.3)}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-TW';u.rate=.82;u.pitch=1.05;
  speechSynthesis.speak(u);
}

function resetGame(){
  visible=new Set(primary);
  selected=[];
  locked=false;
  gamePhase=PHASES.BUILD_3_TO_6;
  reverseQuestions=[];
  reverseIndex=0;
  document.getElementById('complete').classList.remove('show');
  updateCenter();
  render();
  showToast('重新從紅色、黃色、藍色開始');
}
document.getElementById('resetBtn').onclick=resetGame;

makeWheel();
</script>
